<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lucky Message</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather&family=Montserrat&display=swap');

    body {
      background: white;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Montserrat', sans-serif;
      color: #222;
      padding: 20px;
      text-align: center;
    }

    #loading {
      font-size: 2rem; /* smaller size */
      font-weight: 700;
      font-family: 'Merriweather', serif; /* Elegant serif font */
      letter-spacing: 0.12em;
      user-select: none;
      animation: slotColors 2s linear infinite;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    #dots {
      font-weight: 700;
      margin-left: 6px;
      animation: blink 1.2s step-start infinite;
    }

    #message {
      max-width: 700px;
      font-size: 1.8rem;
      font-family: 'Merriweather', serif; /* readable elegant serif */
      font-style: normal;
      line-height: 1.5;
      white-space: pre-wrap;
      margin-top: 40px;
      display: none;
      min-height: 5em;
      position: relative;
      text-align: center;
    }

    /* The blinking cursor element */
    #cursor {
      display: inline-block;
      width: 3px;
      background-color: #222;
      margin-left: 2px;
      animation: blink 1s step-start infinite;
      vertical-align: bottom;
      height: 1.2em;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    @keyframes slotColors {
      0% { color: #e74c3c; }    /* Red */
      20% { color: #f1c40f; }   /* Yellow */
      40% { color: #2ecc71; }   /* Green */
      60% { color: #3498db; }   /* Blue */
      80% { color: #9b59b6; }   /* Purple */
      100% { color: #e74c3c; }  /* Red again */
    }
  </style>
</head>
<body>
  <div id="loading">I'm Feeling Lucky<span id="dots">...</span></div>
  <div id="message"></div>

  <script>
    // Get query param 'id'
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    // Fetch AI message from backend
    async function fetchMessage(id) {
      try {
        const res = await fetch(`/message?id=${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error('Failed to fetch message');
        return (await res.json()).message;
      } catch (e) {
        return '⚠️ Sorry, could not load your lucky message.';
      }
    }

    // Typing effect with cursor following text
    async function typeText(element, text, delay = 40) {
      element.textContent = '';

      // Create a span for the cursor
      const cursor = document.createElement('span');
      cursor.id = 'cursor';
      element.appendChild(cursor);

      for (let i = 0; i < text.length; i++) {
        // Insert next character before cursor
        cursor.insertAdjacentText('beforebegin', text[i]);
        await new Promise(r => setTimeout(r, delay));
      }

      // Remove cursor after typing
      cursor.remove();
    }

    async function main() {
      const loadingEl = document.getElementById('loading');
      const messageEl = document.getElementById('message');
      const id = getQueryParam('id');

      if (!id) {
        loadingEl.textContent = '⚠️ Missing ID in the URL.';
        return;
      }

      // Show loading text for 3 seconds with color animation & blinking dots
      await new Promise(r => setTimeout(r, 3000));

      // Hide loading, show message container
      loadingEl.style.display = 'none';
      messageEl.style.display = 'block';

      // Fetch the AI message
      const message = await fetchMessage(id);

      // Type it out with cursor following
      await typeText(messageEl, message);
    }

    main();
  </script>
</body>
</html>
